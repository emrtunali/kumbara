name: pages

# The site is static: site/ is published as is. Once a month the macro history used by the
# rent-or-buy simulator is refreshed from FRED and committed before publishing.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "0 6 20 * *" # the 20th of each month, after Eurostat's flash estimates
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Refresh macro data (monthly run only)
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/fetch_macro.py
          git config user.name "kumbara-bot"
          git config user.email "kumbara-bot@users.noreply.github.com"
          git add site/data/macro.json
          git diff --cached --quiet || { git commit -m "Monthly macro data refresh"; git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
